name: Burette

options:
  bundleIdPrefix: com.aholic
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Burette:
    type: application
    platform: iOS
    sources:
      - path: Burette
      # 实时活动属性在 App 与 Widget 扩展之间共享（同名类型）。
      - path: Shared
    dependencies:
      - target: BuretteWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aholic.burette
        PRODUCT_NAME: Burette
        # App 图标资源目录（Burette/Assets.xcassets 里的 AppIcon）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CI 会用 VERSION 文件覆盖 MARKETING_VERSION，这里只是本地默认值。
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # SQLite3 系统库（持久化用 SQLiteStore）。import SQLite3 通常会自动链接，
        # 这里显式声明，避免个别工具链下漏链。
        OTHER_LDFLAGS: "-lsqlite3"
        # 使用仓库根目录手写的 Info.plist（CI 会校验 UIFileSharingEnabled 等键）
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    # M3 会接入 Runestone（Tree-sitter 语法高亮）。接入时取消注释，
    # 并按实际发布版本调整 version：
    #
    # dependencies:
    #   - package: Runestone
    #     product: Runestone
    #     version: 0.5.0
    #   - package: TreeSitterLanguages
    #     product: TreeSitterLanguages
    #     version: 0.3.0

  # 灵动岛 / 锁屏实时活动扩展：对话进行时展示进度。
  BuretteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BuretteWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aholic.burette.widget
        PRODUCT_NAME: BuretteWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BuretteWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  BuretteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BuretteTests
    dependencies:
      - target: Burette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aholic.burette.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Burette:
    build:
      targets:
        Burette: all
        BuretteWidget: all
        BuretteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BuretteTests
