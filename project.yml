name: Burette

options:
  bundleIdPrefix: com.burette
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Burette:
    type: application
    platform: iOS
    sources:
      - path: Burette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burette.app
        PRODUCT_NAME: Burette
        # CI 会用 VERSION 文件覆盖 MARKETING_VERSION，这里只是本地默认值。
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 使用仓库根目录手写的 Info.plist（CI 会校验 UIFileSharingEnabled 等键）
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    # M3 会接入 Runestone（Tree-sitter 语法高亮）。接入时取消注释，
    # 并按实际发布版本调整 version：
    #
    # dependencies:
    #   - package: Runestone
    #     product: Runestone
    #     version: 0.5.0
    #   - package: TreeSitterLanguages
    #     product: TreeSitterLanguages
    #     version: 0.3.0

  BuretteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BuretteTests
    dependencies:
      - target: Burette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burette.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Burette:
    build:
      targets:
        Burette: all
        BuretteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BuretteTests
